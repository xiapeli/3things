[package]
name = "threethings"
version = "1.1.3"
description = "3things - Suas 3 prioridades da semana"
authors = ["Phelipe Xavier"]
edition = "2021"

[lib]
name = "threethings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "sync-secret-service", "windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
